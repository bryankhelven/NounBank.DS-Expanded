name: Integrate zero pending authority
on:
  push:
    branches:
      - nbe-v2h-zero-pending-integration-20260929
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download accepted scientific artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          download() {
            local name="$1" id="$2"
            echo "Downloading $name <- artifact $id"
            curl -fL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"               -o "artifacts/${name}.zip"
            unzip -t "artifacts/${name}.zip" >/dev/null
          }

          download 01_real_enmap_001 11068856497
          download 02_real_enmap_002 11068173518
          download 03_real_enmap_003 11068901267
          download 04_real_enmap_004 11067974059
          download 05_real_enmap_005 11068078682
          download 06_real_enmap_006 11068163484
          download 07_real_enmap_007 11068503828
          download 08_real_enmap_008 11068623844
          download 09_real_enmap_009 11067784089
          download 10_awaiting_sense_001 11068394035
          download 11_awaiting_sense_002 11068513748
          download 12_awaiting_sense_003 11068864081
          download 13_construction_001 11069935984
          download 14_construction_002 11069388178
          download 15_final39_001 11070175065
          download 16_final39_002 11069414166
          download 17_final39_003 11069264696
      - name: Apply overlays and rebuild resource
        run: python tools/integrate_zero_pending.py
      - name: Global QA
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, zipfile, re
          s=json.loads(pathlib.Path("jsons/statistics.json").read_text(encoding="utf-8"))
          m=json.loads(pathlib.Path("jsons/_manifest.json").read_text(encoding="utf-8"))
          a=json.loads(pathlib.Path("docs/NBE_V2H_ZERO_PENDING_INTEGRATION.json").read_text(encoding="utf-8"))
          assert len(m["lemmas"]) == 516
          assert s["inventory"]["public_lemmas"] == 516
          assert s["inventory"]["new"] == 371
          assert s["examples"]["pending_occurrences"] == 0
          assert s["pending"]["awaiting_sense"] == 0
          assert s["pending"]["awaiting_english_mapping"] == 0
          assert s["pending"]["construction_specific"] == 0
          assert s["pending"]["retracted_new_cases"] == 0
          assert a["status"] == "PASS_ZERO_PENDING_CANONICAL_INTEGRATION"
          with zipfile.ZipFile("jsons/nounbank.ds_expanded_all_jsons.zip") as z:
              assert len(z.namelist()) == 518
          for bad in ["descoberto","retirado","virado","alternativo","representação"]:
              assert not pathlib.Path(f"jsons/{bad}.json").exists()
          for good in ["descoberta","retirada","virada","alternativa","reapresentação"]:
              assert pathlib.Path(f"jsons/{good}.json").exists()
          print(json.dumps({
            "QA":"PASS",
            "public_lemmas":s["inventory"]["public_lemmas"],
            "new":s["inventory"]["new"],
            "predicative_occurrences":s["examples"]["predicative_occurrences"],
            "pending":s["examples"]["pending_occurrences"],
            "arguments":s["arguments"]["total"]
          },ensure_ascii=False,indent=2))
          PY
      - name: Commit integrated resource
        run: |
          set -euo pipefail
          rm -rf artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate NBE V2H zero-pending scientific authority"
          git push origin HEAD:nbe-v2h-zero-pending-integration-20260929
