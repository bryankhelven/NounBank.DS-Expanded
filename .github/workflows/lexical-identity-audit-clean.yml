name: Audit lexical identity clean
on:
  push:
    branches:
      - lexical-identity-audit-20260929
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/lexical_identity_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: NBE_V2H_LEXICAL_IDENTITY_AUDIT
          path: LEXICAL_IDENTITY_MISMATCH_AUDIT.tsv
