name: One-shot V1 static lemma pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-v1-static-pages.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Generate V1-style static lemma pages
        run: |
          python3 - <<'PY'
          import json, html, re
          from pathlib import Path

          ROOT=Path(".")
          JD=ROOT/"jsons"
          PD=ROOT/"site_pages"
          PD.mkdir(exist_ok=True)

          manifest=json.loads((JD/"_manifest.json").read_text(encoding="utf-8"))["lemmas"]
          expected={x["lemma"] for x in manifest}

          for old in PD.glob("*.html"):
              if old.stem not in expected:
                  old.unlink()

          def esc(x):
              return html.escape("" if x is None else str(x), quote=True)

          def role_class(r):
              return str(r or "").lower()

          def mark_text(ex, lemma):
              text=esc(ex.get("text",""))
              reps=[]
              for role,val in (ex.get("realization") or {}).items():
                  if val:
                      reps.append((len(str(val)),role,str(val),(ex.get("syntax") or {}).get(role)))
              for _,role,val,dep in sorted(reps, reverse=True):
                  needle=esc(val)
                  pos=text.find(needle)
                  if pos>=0:
                      rep=f'<span class="{role_class(role)}">{needle}</span>'
                      if dep:
                          rep+=f'<sub class="deprel">{esc(dep)}</sub>'
                      text=text[:pos]+rep+text[pos+len(needle):]
              form=str((ex.get("predicate") or {}).get("form") or lemma)
              needle=esc(form)
              pos=text.find(needle)
              if pos>=0:
                  rep=f'<span class="rel">{needle}</span>'
                  text=text[:pos]+rep+text[pos+len(needle):]
              return text

          def sense_html(s, lemma, offset):
              roles=[r for r in (s.get("roles") or []) if r.get("id")]
              rids=[r["id"] for r in roles]
              examples=s.get("examples") or []
              er=s.get("english_roleset")
              nb=s.get("nombank_url")
              if er:
                  mapping=f'<a href="{esc(nb)}">{esc(er)}</a>' if nb else esc(er)
              else:
                  mapping='<span class="pending-label">Aguardando resolução</span>'

              source=s.get("english_roleset_source")
              source_html=""
              if source:
                  base=re.sub(r"^verb-","",source)
                  frame=re.sub(r"\.\d+$","",base)
                  source_html=f', source = <a href="https://verbs.colorado.edu/propbank/framesets-english-aliases/{esc(frame)}.html">{esc(source)}</a>'

              out=[]
              out.append(f'<p><strong>Roleset id:</strong> {esc(s.get("pt_roleset"))}, Mapeamento para o inglês: {mapping}{source_html}</p>')
              out.append('<h2>Roles:</h2>')
              if roles:
                  out.append('<ul>')
                  for r in roles:
                      out.append(f'<li class="{role_class(r["id"])}">{esc(r["id"].replace("Arg","Arg "))}: {esc(r.get("desc",""))}</li>')
                  out.append('</ul>')
              else:
                  out.append('<p class="muted">Inventário de papéis aguardando resolução.</p>')

              out.append('<h2>Exemplos:</h2>')
              for i,e in enumerate(examples,1):
                  iid=esc(e.get("instance_id",""))
                  out.append(f'<h3 data-instance-id="{iid}">{i}: {mark_text(e,lemma)}</h3>')
                  out.append('<ul>')
                  out.append(f'<li class="rel">rel: {esc((e.get("predicate") or {}).get("form") or lemma)}</li>')
                  for r in rids:
                      val=(e.get("realization") or {}).get(r)
                      out.append(f'<li class="{role_class(r)}">{esc(r.replace("Arg","Arg "))}: {esc(val) if val else "-"}</li>')
                  out.append('</ul>')
              out.append('<br><br>')

              if examples and rids:
                  out.append('<h2>Realização sintática da estrutura de argumentos</h2>')
                  out.append(f'<div class="argument-table-scroll" tabindex="0" aria-label="Realização sintática"><table id="relations-table-{offset}" class="expanded-arguments" style="--arg-count:{len(rids)}">')
                  out.append('<colgroup><col class="numcol">'+''.join('<col class="argcol">' for _ in rids)+'<col class="textcol"></colgroup>')
                  out.append('<thead><tr><th>#</th>'+''.join(f'<th class="{role_class(r)}">{esc(r.replace("Arg","Arg "))}</th>' for r in rids)+'<th>Texto</th></tr></thead><tbody>')
                  for i,e in enumerate(examples,1):
                      iid=esc(e.get("instance_id",""))
                      cells=''.join(f'<td class="{role_class(r)}">{esc((e.get("realization") or {}).get(r)) if (e.get("realization") or {}).get(r) else "-"}</td>' for r in rids)
                      out.append(f'<tr data-instance-id="{iid}"><td>{i}</td>{cells}<td class="texto">{mark_text(e,lemma)}</td></tr>')
                  out.append('</tbody></table></div>')

                  deps=sorted({v for e in examples for v in (e.get("syntax") or {}).values() if v})
                  if deps:
                      out.append('<h3>Frequência das realizações sintáticas</h3>')
                      out.append('<table class="stats-table"><thead><tr><th>Relação de dependência — Universal Dependencies</th>'+''.join(f'<th class="{role_class(r)}">{esc(r.replace("Arg","Arg "))}</th>' for r in rids)+'</tr></thead><tbody>')
                      for dep in deps:
                          counts=[sum(1 for e in examples if (e.get("syntax") or {}).get(r)==dep) for r in rids]
                          out.append(f'<tr><td>{esc(dep)}</td>'+''.join(f'<td>{n}</td>' for n in counts)+'</tr>')
                      out.append('</tbody></table>')

              return "\n".join(out)

          generated=0
          pending_pages=0
          for item in manifest:
              lemma=item["lemma"]
              data=json.loads((JD/item["filename"]).read_text(encoding="utf-8"))
              is_new=bool(item.get("new"))
              body=[]
              body.append(f'<h1>Nome predicador: <i style="color: red;">{esc(lemma)}</i>{" <sup class=\"new-float\">NEW</sup>" if is_new else ""}</h1>')
              for n,s in enumerate(data.get("senses") or [],1):
                  body.append(sense_html(s,lemma,n))

              pend=data.get("pending_instances") or []
              if pend:
                  pending_pages+=1
                  body.append('<section class="pending-section"><h2>Aguardando resolução de sense/roleset</h2><p class="muted">Estas ocorrências já foram identificadas como predicadoras, mas ainda exigem revisão manual.</p>')
                  for i,e in enumerate(pend,1):
                      body.append(f'<h3>{i}: {mark_text(e,lemma)}</h3><ul><li class="rel">rel: {esc((e.get("predicate") or {}).get("form") or lemma)}</li></ul>')
                  body.append('</section>')

              page=f'''<!DOCTYPE html>
          <html lang="pt">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>{esc(lemma)} - NounBank.DS Expanded</title>
          <link rel="stylesheet" href="../styles.css">
          <style>
          :root{{--header-h:56px}}body{{margin:0}}
          .site-header{{position:sticky;top:0;z-index:1000;background:rgba(20,20,20,.70)}}
          .site-nav{{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px}}
          .site-nav .home-link{{color:#cfe3ff;text-decoration:none;font-weight:600;padding:8px 12px;border-radius:10px;background:rgba(84,102,170,.25)}}
          .site-nav .page-title{{color:#cfd8ff;opacity:.75;font-weight:600;text-align:center;margin:0 12px}}
          .site-nav .download-json{{display:inline-block;text-decoration:none;font-weight:700;padding:10px 14px;border-radius:12px;color:#fff;background:#2e7d32}}
          .expanded-arguments{{width:100%;border-collapse:collapse}}
          .expanded-arguments thead th{{text-align:center;padding:.45rem .6rem;white-space:nowrap}}
          .expanded-arguments tbody td{{padding:.45rem .6rem;vertical-align:top;border-bottom:1px solid #fff}}
          </style>
          </head>
          <body>
          <header class="site-header"><nav class="site-nav">
          <a class="home-link" href="../index.html">Home</a>
          <span class="page-title">{esc(lemma)}</span>
          <a class="download-json" href="../jsons/{esc(item["filename"])}" download="{esc(item["filename"])}">JSON download</a>
          </nav></header>
          <div class="content">
          {"".join(body)}
          </div>
          </body>
          </html>
          '''
              (PD/f"{lemma}.html").write_text(page,encoding="utf-8")
              generated+=1

          assert generated==494, generated
          assert len(list(PD.glob("*.html")))==494, len(list(PD.glob("*.html")))
          assert not any("Carregando" in p.read_text(encoding="utf-8") for p in PD.glob("*.html"))
          print(f"STATIC_PAGES={generated}")
          print(f"PENDING_PAGES={pending_pages}")
          print("LOADING_PLACEHOLDERS=0")
          PY

      - name: Remove dynamic lemma loader and commit
        run: |
          rm -f lemma.js
          rm -f .github/workflows/one-shot-v1-static-pages.yml
          git config user.name "NounBank.DS Expanded Bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Restore V1-style static lemma pages"
          git push origin HEAD:main
