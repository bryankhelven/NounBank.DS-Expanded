    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/final39_batch2_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: NBE_V2H_FINAL39_BATCH2_CANDIDATES
