    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nbe-v2h-lexical-identity-repair-20260929
      - run: python tools/apply_lexical_identity_repair.py
      - run: |
          git status --short
          python - <<'PY'
          import json, pathlib, zipfile
          s=json.loads(pathlib.Path("jsons/statistics.json").read_text(encoding="utf-8"))
          assert s["inventory"]["public_lemmas"]==516
          assert s["inventory"]["new"]==371
          assert s["examples"]["predicative_occurrences"]==3707
          assert s["examples"]["pending_occurrences"]==132
          with zipfile.ZipFile("jsons/nounbank.ds_expanded_all_jsons.zip") as z:
              assert len(z.namelist())==518
          print("VALIDATION PASS")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair lexical identity collapses across public resource"
          git push origin HEAD:nbe-v2h-lexical-identity-repair-20260929
